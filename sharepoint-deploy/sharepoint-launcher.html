<!DOCTYPE html>
<html>
<head>
    <title>LTI OMT Meeting System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .launcher {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
        }
        h1 { color: #1976d2; }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn:hover { background: #1565c0; }
        .note { color: #666; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="launcher">
        <h1>LTI OMT Meeting System</h1>
        <p>Long-Term Isolation Operations Management Tool</p>

        <a class="btn" href="index.html" target="_blank">Launch Application</a>

        <p class="note">
            Click the button above to open the application in a new window.<br>
            This avoids SharePoint frame restrictions.
        </p>
    </div>
</body>
</html>
