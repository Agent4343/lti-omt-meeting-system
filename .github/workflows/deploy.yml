name: Build

# The previous version of this workflow never ran: it triggered on `master`,
# but the default branch is `main`. It also ran `npm test` in both packages,
# where the frontend has no test script and the backend's is still the npm
# default stub that exits 1 - so it would have failed had it ever fired.
#
# This builds what can actually be built. Add test steps here as suites appear;
# see the note at the bottom of the job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: ./frontend
        run: npm test

      # Excel serial dates are converted via Date.UTC. An implementation that
      # slips back to local time passes in UTC and is wrong everywhere east of
      # it, so the suite is run again under a zone that exposes that.
      - name: Test (non-UTC timezone)
        working-directory: ./frontend
        run: npm test
        env:
          TZ: Australia/Sydney

      - name: Build
        working-directory: ./frontend
        # CI=true is already set by Actions. Note this does NOT currently fail
        # on lint warnings: package.json defines no eslintConfig, so
        # react-scripts has no rules to promote to errors.
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  backend:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --no-audit --no-fund

      - name: Check the server parses
        working-directory: ./backend
        run: node --check index.js
